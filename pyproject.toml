[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailprint"
version = "0.1.0"
description = "Print documents across a Tailscale network"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
tailprint = "tailprint.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["tailprint"]

[tool.setuptools.package-data]
tailprint = ["web/*.html", "web/*.js", "web/*.css"]
